name: Jobs Workflow

on:
  workflow_dispatch:

jobs:
  job_1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Install and build
        run: |
          npm install
          npm run build
        # working-directory: ./temp  # Décommente si nécessaire
        shell: bash
        # pwsh, cmd, powershell, python

      - name: Print environment variable with Perl
        run: print %ENV
        shell: perl {0}

