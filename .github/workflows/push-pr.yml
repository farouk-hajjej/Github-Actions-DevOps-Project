# webhook base trigger on branches
on:
   push:
     branches:
       - main
       - "release/**"
     paths:
        - "src/**"
   pull_request:
     branches:
       - main
       - "release/**"
     paths:
        - "src/**"
jobs:
  test:
    runs-on: ubuntu-latest #runner github
    steps:
     - name: Checkout repository 
       uses: actions/checkout@v4.2.2
     - name: Run tests
       run: npm test
    
